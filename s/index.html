<!doctype html>
<!--
  fiammo: /s/<token>, a post its author shared by link, read in the browser.

  _redirects sends every path under /s/ here. The page is the texted post
  reader's sibling (p/read/) and is drawn by the same script and stylesheet
  (/reader/read.js, /reader/read.css). What it may show is decided server-side
  by the post-share-link edge function (fiammo repo, migration 208,
  SHARE_LINKS.md): the post, or "burned" for a link that was turned off or a
  post that is gone. Reading needs nothing: no code, no number, no account.
  The page shows that one post and nothing else its author wrote. A link its
  author made after the post burned (migration 251) shows that post until the
  link's own end, a day after it was last sent.

  The tags below are what Messages and every other unfurler show for the link.
  They are the same for every post on purpose: a preview is built by whoever
  is sent the link, before anyone opens it, and often kept. It must never
  carry the post's words or photos, and nothing here can, because this file is
  static and the post is only fetched by the script after the page opens.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fiammo</title>
<meta name="description" content="A post shared from fiammo. Read it before it burns.">
<meta name="robots" content="noindex">
<!-- The token in the path is the key to this post. Nothing leaving the page,
     an image or a link, gets to carry it in a Referer. -->
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F9F8F6">
<!-- Safari's own "Open / Get" bar for fiammo on iPhone, above the page. -->
<meta name="apple-itunes-app" content="app-id=6791766677">
<meta property="og:type" content="website">
<meta property="og:site_name" content="fiammo">
<meta property="og:title" content="A post shared with you on fiammo">
<meta property="og:description" content="Read it before it burns.">
<meta property="og:image" content="https://fiammo.co/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The fiammo flame">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/flame.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="/reader/read.css?v=8">
</head>
<body>
<main id="app" aria-live="polite">
  <div class="top"><a class="wordmark" href="/"><img class="word" src="/wordmark.svg?v=3" alt="fiammo"></a></div>
  <div class="loading" aria-label="Loading"><i style="width:40%"></i><i style="width:96%"></i><i style="width:88%"></i><i style="width:60%"></i></div>
</main>
<noscript><main><p class="fine">This page needs JavaScript to open the post.</p></main></noscript>
<!-- Under /reader/, not /s/: _redirects rewrites every path under /s/ to this
     page, so a script kept beside it would come back as this HTML. -->
<script src="/reader/read.js?v=8" defer></script>
</body>
</html>
