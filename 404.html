<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not Found · Fiammo</title>
<meta name="description" content="Page not found on Fiammo.">
<meta name="robots" content="noindex">
<link rel="icon" href="flame.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=5">
<style>
  /* Every color here comes from style.css's variables — the page reads as the
     homepage with the hero swapped out, not as a separately styled screen. */
  .error-hero {
    text-align: center;
    padding-top: 46px;
    padding-bottom: 42px;
  }

  /* An unlit mark, not a glowing one. The old splash put the flame in a warm
     copper halo, which made a routing miss look like an event. Nothing
     happened here, so the mark sits cold in a thin ring instead: the shape is
     present, the fire is not. */
  .flame-splash {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 118px;
    height: 118px;
    margin-bottom: 24px;
    border-radius: 50%;
    border: 1px solid var(--border);
  }

  .flame-splash img {
    position: relative;
    height: 52px;
    width: auto;
    filter: grayscale(1);
    opacity: .28;
  }

  /* The sentence is the hero, not the numeral. 404 is what the server calls
     it; it is not what the reader came to find out. */
  .error-code {
    font-family: var(--font-mono);
    font-size: .82rem;
    letter-spacing: .08em;
    color: var(--muted);
    margin: 0 0 10px;
  }

  .error-hero h1 {
    font-size: 1.55rem;
    margin: 0;
  }

  .error-hero p.error-body {
    text-align: center;
    max-width: 430px;
    margin: 16px auto 0;
    color: var(--muted);
  }

  /* Two ways out rather than none. The old page left the footer nav as the
     only exit, which is a lot to ask of someone who arrived by mistake. */
  .error-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 26px;
  }

  .error-actions a {
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: .92rem;
    padding: 11px 24px;
    border-radius: 999px;
    text-decoration: none;
  }

  .error-actions .primary {
    color: var(--on-accent);
    background: var(--gold);
  }

  .error-actions .secondary {
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <a class="wordmark" href="/">
      <img class="mark" src="flame.svg?v=2" alt="">
      <span class="word"><span class="initial">f</span><span class="i">i</span>ammo</span>
    </a>
  </header>

  <!-- Served by Cloudflare Pages for any path that doesn't match a file. Without
       it, Pages falls back to index.html with a 200, so every typo'd or stale
       URL rendered as a page that looked like it had worked.

       The copy deliberately does not say the page burned. Burning is a real
       thing in this product with a specific meaning, and telling someone who
       mistyped a URL that their content expired is both wrong and alarming.
       Nothing was ever at this address, and that is what it should say. -->
  <main class="card error-hero">
    <span class="flame-splash"><img src="flame.svg?v=2" alt=""></span>
    <p class="error-code">404</p>
    <h1>Nothing at this address</h1>
    <p class="error-body">This link doesn't lead anywhere on fiammo. If you followed it from a message, check that the whole thing came through. They're long and easy to cut short.</p>
    <div class="error-actions">
      <a class="primary" href="https://apps.apple.com/app/id6791766677">Get fiammo</a>
      <a class="secondary" href="/support.html">Get help</a>
    </div>
  </main>

  <footer class="site">
    <nav class="footer-nav">
      <a href="/">Home</a>
      <a href="/support.html">Support</a>
      <a href="/privacy.html">Privacy</a>
      <a href="/terms.html">Terms</a>
      <a href="https://apps.apple.com/app/id6791766677">Get the app</a>
    </nav>
    <div class="footer-base">
      <span>&copy; 2026 fiammo</span>
      <span><a href="mailto:hello@fiammo.co">hello@fiammo.co</a></span>
    </div>
  </footer>
</div>
</body>
</html>
