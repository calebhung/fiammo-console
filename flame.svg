<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 -78 90 148" width="90" height="148">
  <!--
    The mark burns on its own, matching AnimatedFlameMark in the app's
    ContentView.swift. Same two paths, same motion, same numbers:

      inner core   scale x .95 -> 1.05, y 1.06 -> .93, anchored at its base
                   opacity .86 -> 1
      whole mark   rotate -1.4deg -> 1.4deg, anchored at the flame's base
      timing       .18s easeInOut, autoreversing, forever

    The animation lives inside the SVG rather than in a stylesheet because the
    mark is used as <img src="flame.svg">, and page CSS cannot reach inside an
    image. This way the header, the hero, and the 404 splash all burn without
    any of them knowing about it.

    transform-box: view-box puts transform-origin in viewBox units measured
    from the viewBox's own corner, so the base of the flame at user-space
    (0, 62) is (0 - -45, 62 - -78) = (45, 140). Anchoring there is what makes
    it lick upward instead of wobbling around its middle.
  -->
  <style>
    .mark, .core {
      transform-box: view-box;
      animation-duration: .18s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }

    .mark {
      transform-origin: 45px 140px;
      animation-name: sway;
    }

    .core {
      transform-origin: 46px 130px;
      animation-name: flicker;
    }

    @keyframes sway {
      from { transform: rotate(-1.4deg); }
      to   { transform: rotate(1.4deg); }
    }

    @keyframes flicker {
      from { transform: scale(.95, 1.06); opacity: .86; }
      to   { transform: scale(1.05, .93); opacity: 1; }
    }

    /* A logo that never stops moving is exactly what this setting is for. */
    @media (prefers-reduced-motion: reduce) {
      .mark, .core { animation: none; }
      .core { opacity: 1; }
    }
  </style>

  <g class="mark">
    <path d="M 0 62 C -30 54, -40 22, -30 -6 C -22 -28, -8 -40, 2 -62 C 4 -67, 9 -70, 12 -66 C 14 -62, 10 -56, 12 -48 C 16 -34, 26 -20, 29 -2 C 33 26, 24 54, 0 62 Z" fill="#2A1F18"/>
    <path class="core" d="M 1 52 C -12 46, -16 30, -12 14 C -9 2, -2 -6, 3 -20 C 7 -8, 12 2, 13 14 C 15 32, 11 47, 1 52 Z" fill="#C96F3B"/>
  </g>
</svg>
