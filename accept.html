<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fiammo — Confirm</title>
<link rel="icon" href="flame.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 480px; }

  #state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
    padding: 56px 32px;
  }
  #state h1 { margin: 0; }
  #state p { margin: 0; color: var(--muted); }
  #state.err h1 { color: var(--accent); }

  #confirm-btn {
    margin-top: 8px;
    padding: 12px 28px;
    border-radius: 10px;
    border: 1px solid var(--accent-strong);
    background: var(--accent);
    color: #FFFDF8;
    font-family: 'Lora', Georgia, serif;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #confirm-btn:hover { background: var(--accent-strong); }
  #confirm-btn:disabled { opacity: 0.5; cursor: default; }

  .disclosure {
    font-family: 'JetBrains Mono', 'SF Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    max-width: 340px;
  }

  .secondary {
    margin-top: 24px;
    font-family: 'JetBrains Mono', 'SF Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .secondary a { color: var(--muted); }
  .secondary a:hover { color: var(--accent-strong); }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <a class="wordmark" href="/">
      <img class="mark" src="flame.svg" alt="">
      <span class="word"><span class="initial">f</span><span class="i">i</span>ammo</span>
    </a>
  </header>

  <section id="state" class="card">
    <h1 id="state-title">get updates on fiammo</h1>
    <p id="state-body">a friend added you so you can get a text whenever they post. no app needed.</p>
    <button id="confirm-btn">yes, text me updates</button>
    <p class="disclosure">
      you'll get a text each time they post. message &amp; data rates may apply.
      reply STOP at any time to opt out.
    </p>
  </section>

  <p class="secondary" id="secondary" style="display:none">
    curious what fiammo is? <a href="index.html">learn more</a>
  </p>

  <footer class="site">
    <span>&copy; 2026 Fiammo</span>
    <span><a href="mailto:hello@fiammo.co">hello@fiammo.co</a></span>
  </footer>
</div>

<script>
  const SUPABASE_URL = "https://syqqxogkqmuojchbglle.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Zcxmg3htO9UvumePY6U3bw_wQrh7X6K";

  const stateEl = document.getElementById("state");
  const titleEl = document.getElementById("state-title");
  const bodyEl = document.getElementById("state-body");
  const secondaryEl = document.getElementById("secondary");
  const btnEl = document.getElementById("confirm-btn");
  const disclosureEl = document.querySelector(".disclosure");

  const token = new URLSearchParams(location.search).get("token");

  function show(title, body, isError) {
    titleEl.textContent = title;
    bodyEl.textContent = body;
    stateEl.classList.toggle("err", !!isError);
    btnEl.style.display = "none";
    disclosureEl.style.display = "none";
    secondaryEl.style.display = "block";
  }

  if (!token) {
    show("this link isn't valid", "check that you copied the whole link from the text.", true);
  }

  // Confirmation is a deliberate, single click — nothing is sent to the server,
  // and nobody is enrolled in anything, until this button is pressed.
  btnEl.addEventListener("click", async () => {
    btnEl.disabled = true;
    btnEl.textContent = "confirming…";

    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/accept-circle-invite`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "apikey": SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ token }),
      });
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        show(
          "this link isn't valid",
          "it may have already been used, or check that you copied the whole link.",
          true
        );
        return;
      }

      const name = data.owner_name || "your friend";
      show(
        "you're set",
        `you'll get a text from ${name} whenever they post to fiammo. reply STOP anytime to opt out.`,
        false
      );
    } catch (e) {
      btnEl.disabled = false;
      btnEl.textContent = "yes, text me updates";
      show("something went wrong", "give it another try in a moment.", true);
      btnEl.style.display = "inline-block";
      disclosureEl.style.display = "block";
    }
  });
</script>
</body>
</html>
